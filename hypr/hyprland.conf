
# New display who this?
monitor = , preferred, auto, 1

# Home
monitor = desc:AU Optronics 0x31A6, 1920x1200@60.01, 0x0, 1
monitor = desc:Philips Consumer Electronics Company PHL 499P9 AU02440002348, 5120x1440@29.98Hz, -5120x0, 1

# Flex desk next to Humbert
monitor = desc:LG Electronics LG HDR 4K 0x00079C46, 2560x1440@59.95Hz, 1920x0, 1
monitor = desc:LG Electronics LG HDR 4K 0x00079C33, 3840x2160@60.00, 4480x0, 1

# Carbonara
monitor = desc:Dell Inc. DELL P2419HC CPYNJ73, 1920x1080@60.00, -3840x0, 1
monitor = desc:Dell Inc. DELL P2419HC 85ZNJ73, 1920x1080@60.00, -1920x0, 1

# Back to fishbowl?
monitor = desc:Dell Inc. DELL P2419HC 1WXNJ73, 1920x1080@60.00, 1920x0, 1
monitor = desc:Dell Inc. DELL P2419HC 1DQNJ73, 1920x1080@60.00, 3840x0, 1  

env = SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/ssh-agent.socket

$terminal = terminator
$fileManager = nemo
$menu = wofi --show drun
exec-once = waybar
exec-once = hyprpaper
exec-once = swayidle -w timeout 1800 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on'
exec-once = terminator -e "docker run -t --rm rust-stakeholder --dev-type dev-ops --jargon extreme --project \"sto-1-Development\""
env = XCURSOR_SIZE,30
env = HYPRCURSOR_SIZE,30
env = XDG_DATA_DIRS,/usr/local/share:/usr/share:$HOME/.local/share
general {
    gaps_in = 10
    gaps_out = 30
    border_size = 5
    col.active_border = rgba(fc4903ee) rgba(fca903ee) 
    col.inactive_border = rgba(4f2f00ee) rgba(4f3700ee) 45deg
    resize_on_border = false
    allow_tearing = false
    layout = dwindle    
}

decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)    
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

dwindle {
    preserve_split = true 
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 1 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, N, exec, nemo
bind = $mainMod, C, exec, claude
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, exec, firefox
bind = $mainMod, Z, togglesplit, # switcheroo
bind = $mainMod, A, swapsplit, # switcheroo
bind = $mainMod, M, exec, spotify-launcher
bind = $mainMod, P, exec, $menu
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, S, exec, signal-desktop --password-store="gnome-libsecret"
bind = $mainMod, T, exec, vscodium
bind = $mainMod, V, togglefloating,
bind = $mainMod, Y, fullscreenstate, -1 2  # Equivalent to the old fakefullscreen

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10


bind = $mainMod SHIFT, Return, exec, $terminal
bind = $mainMod SHIFT, C, killactive,
bind = $mainMod SHIFT, L, exec, swaylock -c 89380F --key-hl-color 234990 --line-color 234990 --ring-color f7f9fd  --layout-bg-color f7f9fd  --inside-color 89380F

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Ignore maximize requests from apps.
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

windowrulev2 = maximize, class:^(firefox)$,fullscreen:1
